name: Deploy PWA to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: solar-pages
  cancel-in-progress: false
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: node --check app.js
      - name: Prepare official TONE3000 NAM runtime
        run: |
          rm -rf /tmp/tone-nam
          git clone --depth 1 https://github.com/tone-3000/neural-amp-modeler-wasm.git /tmp/tone-nam
          cp /tmp/tone-nam/ui/public/t3k-wasm-module.js .
          cp /tmp/tone-nam/ui/public/t3k-wasm-module.wasm .
          cp /tmp/tone-nam/ui/public/t3k-wasm-module.worker.js .
          cp /tmp/tone-nam/ui/public/t3k-wasm-module.aw.js .
          cp /tmp/tone-nam/ui/public/t3k-wasm-module.ww.js .
          cp /tmp/tone-nam/ui/public/models/ac10.nam nam-default.nam
          test -s t3k-wasm-module.js
          test -s t3k-wasm-module.wasm
          test -s t3k-wasm-module.aw.js
          test -s nam-default.nam
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
