name: Deploy PWA to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: solar-pages
  cancel-in-progress: false
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: node --check app.js
      - name: Prepare local NAM Web runtime
        run: |
          rm -rf /tmp/solar-nam-web vendor/nam-web
          npm install --prefix /tmp/solar-nam-web --no-save @happysoftware/nam-web@0.2.0
          mkdir -p vendor/nam-web
          cp -R /tmp/solar-nam-web/node_modules/@happysoftware/nam-web/dist/. vendor/nam-web/
          test -f vendor/nam-web/worklet.js
          test -f vendor/nam-web/nam-wasm.wasm
          test -f vendor/nam-web/index.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
