name: Deploy PWA to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: solar-pages
  cancel-in-progress: false
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript
        run: node --check app.js
      - name: Prepare official NAM v2 runtime
        run: |
          mkdir -p /tmp/nam-package
          npm pack neural-amp-modeler-wasm@2.0.1 --pack-destination /tmp/nam-package
          tar -xzf /tmp/nam-package/neural-amp-modeler-wasm-2.0.1.tgz -C /tmp/nam-package
          cp /tmp/nam-package/package/dist/engine/nam-worklet.js ./nam-worklet.js
          cp /tmp/nam-package/package/dist/engine/nam-engine.wasm ./nam-engine.wasm
          test -s nam-worklet.js
          test -s nam-engine.wasm
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
