name: Deploy PWA to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: solar-pages
  cancel-in-progress: false
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: node --check app.js
      - name: Prepare local NAM WASM runtime
        run: |
          rm -rf /tmp/solar-nam vendor/nam-wasm
          npm install --prefix /tmp/solar-nam --no-save @opendaw/nam-wasm@1.2.0
          mkdir -p vendor/nam-wasm
          cp -R /tmp/solar-nam/node_modules/@opendaw/nam-wasm/dist/. vendor/nam-wasm/
          test -f vendor/nam-wasm/index.js
          test -f vendor/nam-wasm/nam.js
          test -f vendor/nam-wasm/nam.wasm
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
