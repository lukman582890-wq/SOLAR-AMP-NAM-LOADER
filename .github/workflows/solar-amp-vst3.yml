name: Build SOLAR AMP VST3
# WebView2 native GUI build - force NO_IGRAPHICS

on:
  workflow_dispatch:
  push:
    paths:
      - 'vst3/**'
      - '.github/workflows/solar-amp-vst3.yml'

permissions:
  contents: read

jobs:
  build-windows:
    name: Build SOLAR AMP VST3 (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout SOLAR AMP
        uses: actions/checkout@v4

      - name: Checkout NAM foundation
        shell: bash
        run: |
          git clone --recursive https://github.com/sdatkinson/NeuralAmpModelerPlugin.git nam-vst3-source
          cd nam-vst3-source
          git checkout 16be869746b8915885c7a35bafdcc0061faeb50e
          git submodule update --init --recursive

      - name: Prepare WebView2 build dependencies
        shell: pwsh
        run: |
          $dep = Resolve-Path nam-vst3-source/iPlug2/Dependencies
          New-Item -ItemType Directory -Force "$dep/Extras" | Out-Null
          $wil = "$dep/Extras/wil"
          if (-not (Test-Path "$wil/include/wil/com.h")) {
            git clone --depth 1 --branch v1.0.240803.1 https://github.com/microsoft/wil.git $wil
          }
          $wv = "$dep/Extras/WebView2"
          if (-not (Test-Path "$wv/build/native/include/WebView2.h")) {
            New-Item -ItemType Directory -Force $wv | Out-Null
            Invoke-WebRequest 'https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.2903.40' -OutFile "$wv/webview2.zip"
            Expand-Archive "$wv/webview2.zip" -DestinationPath $wv -Force
            Remove-Item "$wv/webview2.zip" -Force
          }

      - name: Prepare SOLAR AMP identity
        shell: pwsh
        run: |
          $root = Resolve-Path nam-vst3-source
          $config = Join-Path $root 'NeuralAmpModeler\config.h'
          $props = Join-Path $root 'NeuralAmpModeler\config\NeuralAmpModeler-win.props'

          $s = [IO.File]::ReadAllText($config)
          $s = $s.Replace('#define PLUG_NAME "NeuralAmpModeler"', '#define PLUG_NAME "SOLAR AMP"')
          $s = $s.Replace('#define PLUG_MFR "Steven Atkinson"', '#define PLUG_MFR "SOLAR AMP"')
          $s = $s.Replace("#define PLUG_UNIQUE_ID '1YEo'", "#define PLUG_UNIQUE_ID 'SAMP'")
          $s = $s.Replace("#define PLUG_MFR_ID 'SDAa'", "#define PLUG_MFR_ID 'SLAr'")
          $s = $s.Replace('#define PLUG_URL_STR "https://github.com/sdatkinson/NeuralAmpModelerPlugin"', '#define PLUG_URL_STR "https://github.com/lukman582890-wq/SOLAR-AMP-NAM-LOADER"')
          $s = $s.Replace('#define PLUG_EMAIL_STR "spam@me.com"', '#define PLUG_EMAIL_STR "solaramp@users.noreply.github.com"')
          $s = $s.Replace('#define BUNDLE_NAME "NeuralAmpModeler"', '#define BUNDLE_NAME "SOLAR AMP"')
          $s = $s.Replace('#define BUNDLE_MFR "StevenAtkinson"', '#define BUNDLE_MFR "SOLARAMP"')
          $s = $s.Replace('#define SHARED_RESOURCES_SUBPATH "NeuralAmpModeler"', '#define SHARED_RESOURCES_SUBPATH "SOLAR AMP"')
          $s = $s.Replace('#define PLUG_WIDTH 600', '#define PLUG_WIDTH 1080')
          $s = $s.Replace('#define PLUG_HEIGHT 400', '#define PLUG_HEIGHT 780')
          [IO.File]::WriteAllText($config, $s, (New-Object Text.UTF8Encoding($false)))

          $p = [IO.File]::ReadAllText($props)
          $p = $p.Replace('<BINARY_NAME>NeuralAmpModeler</BINARY_NAME>', '<BINARY_NAME>SOLARAMP</BINARY_NAME>')
          $p = $p.Replace('<EXTRA_ALL_DEFS>IGRAPHICS_NANOVG;IGRAPHICS_GL2;GRAYED_ALPHA=0.5f;NAM_ENABLE_A2_FAST</EXTRA_ALL_DEFS>', '<EXTRA_ALL_DEFS>WEBVIEW_EDITOR_DELEGATE;IGRAPHICS_NANOVG;IGRAPHICS_GL2;GRAYED_ALPHA=0.5f;NAM_ENABLE_A2_FAST</EXTRA_ALL_DEFS>')
          $p = $p.Replace('<EXTRA_INC_PATHS>', '<EXTRA_INC_PATHS>$(IPLUG2_ROOT)\Dependencies\Extras\nlohmann;$(IPLUG2_ROOT)\Dependencies\Extras\wil\include;$(IPLUG2_ROOT)\Dependencies\Extras\WebView2\build\native\include;')
          $p = [regex]::Replace($p, '<AdditionalIncludeDirectories>', '<AdditionalIncludeDirectories>$(IPLUG2_ROOT)\Dependencies\Extras\wil\include;$(IPLUG2_ROOT)\Dependencies\Extras\WebView2\build\native\include;')
          $p = [regex]::Replace($p, '<AdditionalDependencies>', '<AdditionalDependencies>wininet.lib;comctl32.lib;Shlwapi.lib;ole32.lib;user32.lib;advapi32.lib;shell32.lib;WebView2LoaderStatic.lib;')
          $p = [regex]::Replace($p, '<AdditionalLibraryDirectories>', '<AdditionalLibraryDirectories>$(IPLUG2_ROOT)\Dependencies\Extras\WebView2\build\native\x64;')
          [IO.File]::WriteAllText($props, $p, (New-Object Text.UTF8Encoding($false)))

          if ((Select-String -Path $config -Pattern '#define PLUG_UNIQUE_ID ''1YEo''').Count -gt 0) { throw 'Old NAM unique ID still present.' }
          if ((Select-String -Path $config -Pattern '#define PLUG_NAME "SOLAR AMP"').Count -eq 0) { throw 'SOLAR AMP plugin name patch failed.' }
          if ((Select-String -Path $props -Pattern 'WEBVIEW_EDITOR_DELEGATE;IGRAPHICS_NANOVG;IGRAPHICS_GL2').Count -eq 0) { throw 'WebView build definitions missing.' }
          Write-Host 'SOLAR AMP identity and WebView build configuration prepared.'

      - name: Prepare SOLAR AMP WebView source and UI
        shell: pwsh
        run: |
          .\vst3\prepare-solar-webview.ps1

      - name: Get iPlug2 SDK
        shell: bash
        working-directory: nam-vst3-source
        run: |
          cd iPlug2/Dependencies/IPlug
          ./download-iplug-sdks.sh

      - name: Get prebuilt audio libraries
        shell: bash
        working-directory: nam-vst3-source
        run: |
          cd iPlug2/Dependencies
          ./download-prebuilt-libs.sh

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build VST3
        shell: pwsh
        run: |
          msbuild 'nam-vst3-source\NeuralAmpModeler\projects\NeuralAmpModeler-vst3.vcxproj' /m /p:Configuration=Release /p:Platform=x64 /p:BuildProjectReferences=true /p:TargetName=SOLARAMP /p:SolutionDir="$PWD\nam-vst3-source\NeuralAmpModeler\" /p:PostBuildEventUseInBuild=false /p:PreBuildEventUseInBuild=false

      - name: Locate VST3 and install Web UI resources
        shell: pwsh
        run: |
          $bin = Get-ChildItem 'nam-vst3-source\NeuralAmpModeler\build-win' -Recurse -File |
            Where-Object { $_.Name -in @('SOLARAMP.vst3','NeuralAmpModeler.vst3') } |
            Select-Object -First 1
          if (-not $bin) { throw 'No built VST3 binary found.' }
          $bundle = 'vst3-dist\SOLAR AMP.vst3\Contents\x86_64-win'
          New-Item -ItemType Directory -Force $bundle | Out-Null
          Copy-Item $bin.FullName (Join-Path $bundle 'SOLARAMP.vst3') -Force
          $resources = 'vst3-dist\SOLAR AMP.vst3\Contents\Resources\web'
          New-Item -ItemType Directory -Force $resources | Out-Null
          Copy-Item 'nam-vst3-source\NeuralAmpModeler\Resources\web\*' $resources -Recurse -Force
          Write-Host "VST3 binary: $($bin.FullName)"
          Write-Host "Web UI: $resources"

      - name: Validate
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/Tracktion/pluginval/releases/download/latest_release/pluginval_Windows.zip' -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval -Force
          & '.\pluginval\pluginval.exe' --skip-gui-tests --validate-in-process --validate (Resolve-Path 'vst3-dist\SOLAR AMP.vst3')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify SOLAR AMP WebView bundle
        shell: pwsh
        run: |
          $bundle = Resolve-Path 'vst3-dist\SOLAR AMP.vst3'
          $dll = Get-ChildItem $bundle -Recurse -File -Filter 'SOLARAMP.vst3' | Select-Object -First 1
          if (-not $dll) { throw 'SOLARAMP.vst3 binary not found inside the bundle.' }
          if (-not (Test-Path (Join-Path $bundle 'Contents\Resources\web\index.html'))) { throw 'WebView index.html missing.' }
          if (-not (Test-Path (Join-Path $bundle 'Contents\Resources\web\solar-amp-web.js'))) { throw 'SOLAR AMP WebView JS missing.' }
          $old = Get-ChildItem $bundle -Recurse -File -Filter 'NeuralAmpModeler.vst3'
          if ($old) { throw 'Old NeuralAmpModeler.vst3 binary still exists in SOLAR AMP bundle.' }
          Write-Host 'SOLAR AMP WebView bundle identity/resources verified.'

      - name: Package
        shell: pwsh
        run: |
          if (Test-Path 'SOLAR-AMP-VST3-Windows-x64.zip') { Remove-Item 'SOLAR-AMP-VST3-Windows-x64.zip' -Force }
          Compress-Archive -Path 'vst3-dist\SOLAR AMP.vst3' -DestinationPath 'SOLAR-AMP-VST3-Windows-x64.zip' -Force

      - name: Upload installable bundle
        uses: actions/upload-artifact@v4
        with:
          name: SOLAR-AMP-VST3-Windows-x64
          path: vst3-dist/
          if-no-files-found: error
