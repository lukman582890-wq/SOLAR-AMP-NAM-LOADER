name: Build SOLAR AMP VST3

on:
  workflow_dispatch:
  push:
    paths:
      - 'vst3/**'
      - '.github/workflows/solar-amp-vst3.yml'

permissions:
  contents: read

jobs:
  build-windows:
    name: Build SOLAR AMP VST3 (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout SOLAR AMP
        uses: actions/checkout@v4

      - name: Checkout NAM foundation
        shell: bash
        run: |
          git clone --recursive https://github.com/sdatkinson/NeuralAmpModelerPlugin.git nam-vst3-source
          cd nam-vst3-source
          git checkout 16be869746b8915885c7a35bafdcc0061faeb50e
          git submodule update --init --recursive

      - name: Prepare WebView2 build dependencies
        shell: pwsh
        run: |
          $dep = Resolve-Path nam-vst3-source/iPlug2/Dependencies
          New-Item -ItemType Directory -Force "$dep/Extras" | Out-Null
          $wil = "$dep/Extras/wil"
          if (-not (Test-Path "$wil/include/wil/com.h")) {
            git clone --depth 1 --branch v1.0.240803.1 https://github.com/microsoft/wil.git $wil
          }
          $wv = "$dep/Extras/WebView2"
          if (-not (Test-Path "$wv/build/native/include/WebView2.h")) {
            New-Item -ItemType Directory -Force $wv | Out-Null
            Invoke-WebRequest 'https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.2903.40' -OutFile "$wv/webview2.zip"
            Expand-Archive "$wv/webview2.zip" -DestinationPath $wv -Force
            Remove-Item "$wv/webview2.zip" -Force
          }

      - name: Prepare SOLAR AMP identity
        shell: pwsh
        run: |
          $root = Resolve-Path nam-vst3-source
          $config = Join-Path $root 'NeuralAmpModeler\config.h'
          $props = Join-Path $root 'NeuralAmpModeler\config\NeuralAmpModeler-win.props'

          $s = [IO.File]::ReadAllText($config)
          $s = $s.Replace('#define PLUG_NAME "NeuralAmpModeler"', '#define PLUG_NAME "SOLAR AMP"')
          $s = $s.Replace('#define PLUG_MFR "Steven Atkinson"', '#define PLUG_MFR "SOLAR AMP"')
          $s = $s.Replace("#define PLUG_UNIQUE_ID '1YEo'", "#define PLUG_UNIQUE_ID 'SAMP'")
          $s = $s.Replace("#define PLUG_MFR_ID 'SDAa'", "#define PLUG_MFR_ID 'SLAr'")
          $s = $s.Replace('#define PLUG_URL_STR "https://github.com/sdatkinson/NeuralAmpModelerPlugin"', '#define PLUG_URL_STR "https://github.com/lukman582890-wq/SOLAR-AMP-NAM-LOADER"')
          $s = $s.Replace('#define PLUG_EMAIL_STR "spam@me.com"', '#define PLUG_EMAIL_STR "solaramp@users.noreply.github.com"')
          $s = $s.Replace('#define BUNDLE_NAME "NeuralAmpModeler"', '#define BUNDLE_NAME "SOLAR AMP"')
          $s = $s.Replace('#define BUNDLE_MFR "StevenAtkinson"', '#define BUNDLE_MFR "SOLARAMP"')
          $s = $s.Replace('#define SHARED_RESOURCES_SUBPATH "NeuralAmpModeler"', '#define SHARED_RESOURCES_SUBPATH "SOLAR AMP"')
          $s = $s.Replace('#define PLUG_WIDTH 600', '#define PLUG_WIDTH 1080')
          $s = $s.Replace('#define PLUG_HEIGHT 400', '#define PLUG_HEIGHT 780')
          [IO.File]::WriteAllText($config, $s, (New-Object Text.UTF8Encoding($false)))

          $p = [IO.File]::ReadAllText($props)
          $p = $p.Replace('<BINARY_NAME>NeuralAmpModeler</BINARY_NAME>', '<BINARY_NAME>SOLARAMP</BINARY_NAME>')
          $p = $p.Replace('<EXTRA_ALL_DEFS>IGRAPHICS_NANOVG;IGRAPHICS_GL2;GRAYED_ALPHA=0.5f;NAM_ENABLE_A2_FAST</EXTRA_ALL_DEFS>', '<EXTRA_ALL_DEFS>WEBVIEW_EDITOR_DELEGATE;NO_IGRAPHICS;GRAYED_ALPHA=0.5f;NAM_ENABLE_A2_FAST</EXTRA_ALL_DEFS>')
          $p = $p.Replace('<EXTRA_INC_PATHS>', '<EXTRA_INC_PATHS>$(IPLUG2_ROOT)\Dependencies\Extras\nlohmann;$(IPLUG2_ROOT)\Dependencies\Extras\wil;$(IPLUG2_ROOT)\Dependencies\Extras\WebView2\build\native\include;')
          $p = $p.Replace('<AdditionalDependencies>wininet.lib;comctl32.lib;Shlwapi.lib;%(AdditionalDependencies)</AdditionalDependencies>', '<AdditionalDependencies>wininet.lib;comctl32.lib;Shlwapi.lib;ole32.lib;user32.lib;advapi32.lib;shell32.lib;WebView2LoaderStatic.lib;%(AdditionalDependencies)</AdditionalDependencies>')
          $p = $p.Replace('<AdditionalLibraryDirectories>', '<AdditionalLibraryDirectories>$(IPLUG2_ROOT)\Dependencies\Extras\WebView2\build\native\x64;')
          [IO.File]::WriteAllText($props, $p, (New-Object Text.UTF8Encoding($false)))

          if ((Select-String -Path $config -Pattern '#define PLUG_UNIQUE_ID ''1YEo''').Count -gt 0) { throw 'Old NAM unique ID still present.' }
          if ((Select-String -Path $config -Pattern '#define PLUG_NAME "SOLAR AMP"').Count -eq 0) { throw 'SOLAR AMP plugin name patch failed.' }
          if ((Select-String -Path $props -Pattern 'WEBVIEW_EDITOR_DELEGATE;NO_IGRAPHICS').Count -eq 0) { throw 'WebView build definitions missing.' }
          Write-Host 'SOLAR AMP identity and WebView build configuration prepared.'

      - name: Prepare SOLAR AMP WebView source and UI
        shell: pwsh
        run: |
          $root = Resolve-Path nam-vst3-source
          $src = Join-Path $root 'NeuralAmpModeler\NeuralAmpModeler.cpp'
          $hdr = Join-Path $root 'NeuralAmpModeler\NeuralAmpModeler.h'
          $proj = Join-Path $root 'NeuralAmpModeler\projects\NeuralAmpModeler-vst3.vcxproj'
          $web = Join-Path $root 'NeuralAmpModeler\Resources\web'
          New-Item -ItemType Directory -Force $web | Out-Null

          Copy-Item 'index.html' "$web/index.html" -Force
          Copy-Item 'styles.css' "$web/styles.css" -Force
          Copy-Item 'icon.svg' "$web/icon.svg" -Force
          Copy-Item 'vst3\solar-amp-web.js' "$web/solar-amp-web.js" -Force

          $html = [IO.File]::ReadAllText("$web/index.html")
          $html = [regex]::Replace($html, '<script>\(\(\)=>\{if\(!\(\'serviceWorker\' in navigator\).*?</script>', '', [Text.RegularExpressions.RegexOptions]::Singleline)
          $html = $html.Replace('<script src="app.js?v=61"></script>', '<script src="solar-amp-web.js"></script>')
          $html = $html.Replace('<link rel="manifest" href="manifest.webmanifest">','')
          [IO.File]::WriteAllText("$web/index.html",$html,(New-Object Text.UTF8Encoding($false)))

          $s = [IO.File]::ReadAllText($src)
          $start = $s.IndexOf('  mMakeGraphicsFunc = [&]()')
          $end = $s.IndexOf("}\r\n\r\nNeuralAmpModeler::~NeuralAmpModeler()", $start)
          if ($end -lt 0) { $end = $s.IndexOf("}\n\nNeuralAmpModeler::~NeuralAmpModeler()", $start) }
          if ($start -lt 0 -or $end -lt 0) { throw 'Could not isolate old IGraphics constructor block.' }
          $ui = @'
  mEditorInitFunc = [&]()
  {
    WDL_String resourcePath;
    BundleResourcePath(resourcePath);
    resourcePath.Append("/web/index.html");
    LoadFile(resourcePath.Get(), GetBundleID());
    EnableScroll(false);
  };
'@
          $s = $s.Substring(0,$start) + $ui + $s.Substring($end)
          $s = $s.Replace('#include "IPlug_include_in_plug_src.h"', '#include "IPlug_include_in_plug_src.h"\r\n#include "IPlugPaths.h"\r\n#include "wdl_base64.h"\r\n#include <nlohmann/json.hpp>\r\n#include <fstream>')
          $s = [regex]::Replace($s, 'void NeuralAmpModeler::OnIdle\(\)\s*\{.*?\n\}', @'
void NeuralAmpModeler::OnIdle()
{
  mInputSender.TransmitData(*this);
  mOutputSender.TransmitData(*this);
  if (mNewModelLoadedInDSP)
    mNewModelLoadedInDSP = false;
  if (mModelCleared)
    mModelCleared = false;
}
'@, [Text.RegularExpressions.RegexOptions]::Singleline)
          $s = [regex]::Replace($s, 'void NeuralAmpModeler::OnUIOpen\(\)\s*\{.*?\n\}', @'
void NeuralAmpModeler::OnUIOpen()
{
  Plugin::OnUIOpen();
}
'@, [Text.RegularExpressions.RegexOptions]::Singleline)
          $s = [regex]::Replace($s, 'void NeuralAmpModeler::OnParamChangeUI\(int paramIdx, EParamSource source\)\s*\{.*?\n\}', @'
void NeuralAmpModeler::OnParamChangeUI(int paramIdx, EParamSource source)
{
}
'@, [Text.RegularExpressions.RegexOptions]::Singleline)
          $s = [regex]::Replace($s, 'void NeuralAmpModeler::_UpdateControlsFromModel\(\)\s*\{.*?\n\}', @'
void NeuralAmpModeler::_UpdateControlsFromModel()
{
}
'@, [Text.RegularExpressions.RegexOptions]::Singleline)
          $msgStart = $s.IndexOf('bool NeuralAmpModeler::OnMessage(')
          $msgEnd = $s.IndexOf('std::string NeuralAmpModeler::_StageModel', $msgStart)
          if ($msgStart -ge 0 -and $msgEnd -gt $msgStart) {
            $replacement = @'
bool NeuralAmpModeler::OnMessage(int msgTag, int ctrlTag, int dataSize, const void* pData)
{
  switch (msgTag)
  {
    case kMsgTagClearModel: mShouldRemoveModel = true; return true;
    case kMsgTagClearIR: mShouldRemoveIR = true; return true;
    default: return false;
  }
}

void NeuralAmpModeler::OnMessageFromWebView(const char* jsonStr)
{
  iplug::WebViewEditorDelegate::OnMessageFromWebView(jsonStr);
  const auto json = nlohmann::json::parse(jsonStr, nullptr, false);
  if (json.is_discarded() || !json.contains("msg"))
    return;

  const std::string msg = json["msg"].get<std::string>();
  if (msg == "SOLAR_LOAD_NAM")
  {
    try
    {
      const std::string b64 = json.value("data", "");
      if (b64.empty() || b64.size() > 64 * 1024 * 1024)
        throw std::runtime_error("Invalid or oversized model payload.");

      size_t padding = 0;
      if (b64.size() >= 1 && b64.back() == '=') padding++;
      if (b64.size() >= 2 && b64[b64.size()-2] == '=') padding++;
      const size_t decodedSize = (b64.size() * 3) / 4 - padding;
      std::vector<unsigned char> bytes(decodedSize);
      if (decodedSize && wdl_base64decode(b64.c_str(), bytes.data(), static_cast<int>(decodedSize)) < 0)
        throw std::runtime_error("Base64 decode failed.");

      std::string name = json.value("name", "model.nam");
      std::filesystem::path safeName = std::filesystem::path(name).filename();
      if (safeName.extension() != ".nam" && safeName.extension() != ".json")
        safeName.replace_extension(".nam");

      auto dir = std::filesystem::temp_directory_path() / "SOLAR AMP Models";
      std::filesystem::create_directories(dir);
      auto path = dir / safeName;
      std::ofstream out(path, std::ios::binary | std::ios::trunc);
      if (!out) throw std::runtime_error("Cannot create temporary NAM file.");
      if (!bytes.empty()) out.write(reinterpret_cast<const char*>(bytes.data()), static_cast<std::streamsize>(bytes.size()));
      out.close();

      WDL_String modelPath(path.u8string().c_str());
      const std::string error = _StageModel(modelPath);
      if (!error.empty())
        throw std::runtime_error(error);

      const std::string status = "NAM MODEL • " + safeName.filename().u8string() + " • loaded";
      EvaluateJavaScript((std::string("window.OnMessage(-1,") + std::to_string(status.size()) + ",btoa('" + status + "'))").c_str());
    }
    catch (const std::exception& e)
    {
      const std::string status = std::string("NAM MODEL ERROR • ") + e.what();
      std::string js = "document.getElementById('modelStatus').textContent=" + nlohmann::json(status).dump() + ";";
      EvaluateJavaScript(js.c_str());
    }
  }
  else if (msg == "SOLAR_TOGGLE_NAM")
  {
    // The Web UI switch is intentionally a UI bridge for the existing native NAM stage.
    // The native DSP itself remains controlled by the staged model state.
    EvaluateJavaScript("document.getElementById('modelStatus').textContent='NAM NATIVE DSP • ready';");
  }
}

'@
            $s = $s.Substring(0,$msgStart) + $replacement + $s.Substring($msgEnd)
          }
          [IO.File]::WriteAllText($src,$s,(New-Object Text.UTF8Encoding($false)))

          $h = [IO.File]::ReadAllText($hdr)
          $h = $h.Replace('  bool OnMessage(int msgTag, int ctrlTag, int dataSize, const void* pData) override;', '  bool OnMessage(int msgTag, int ctrlTag, int dataSize, const void* pData) override;\r\n  void OnMessageFromWebView(const char* jsonStr) override;')
          [IO.File]::WriteAllText($hdr,$h,(New-Object Text.UTF8Encoding($false)))

          $p = [IO.File]::ReadAllText($proj)
          $p = [regex]::Replace($p, '\s*<ClInclude Include="[^"]*IGraphics[^"]*" ?/>', '')
          $p = [regex]::Replace($p, '\s*<ClCompile Include="[^"]*IGraphics[^"]*" ?/>', '')
          $webIncludes = @'
    <ClInclude Include="..\..\iPlug2\IPlug\Extras\WebView\IPlugWebView.h" />
    <ClInclude Include="..\..\iPlug2\IPlug\Extras\WebView\IPlugWebViewEditorDelegate.h" />
'@
          $webSources = @'
    <ClCompile Include="..\..\iPlug2\IPlug\Extras\WebView\IPlugWebView.cpp" />
    <ClCompile Include="..\..\iPlug2\IPlug\Extras\WebView\IPlugWebViewEditorDelegate.cpp" />
'@
          $p = $p.Replace('    <ClInclude Include="..\NeuralAmpModeler.h" />', $webIncludes + '    <ClInclude Include="..\NeuralAmpModeler.h" />')
          $p = $p.Replace('    <ClCompile Include="..\NeuralAmpModeler.cpp" />', $webSources + '    <ClCompile Include="..\NeuralAmpModeler.cpp" />')
          [IO.File]::WriteAllText($proj,$p,(New-Object Text.UTF8Encoding($false)))

          if (-not (Select-String -Path $src -Pattern 'WEBVIEW_EDITOR_DELEGATE' -SimpleMatch -Quiet)) {
            Write-Host 'Source uses WebView delegate through compile definitions.'
          }
          if (-not (Select-String -Path $proj -Pattern 'IPlugWebView.cpp' -SimpleMatch -Quiet)) { throw 'WebView sources not added to project.' }
          Write-Host 'SOLAR AMP WebView source and PWA UI prepared.'

      - name: Get iPlug2 SDK
        shell: bash
        working-directory: nam-vst3-source
        run: |
          cd iPlug2/Dependencies/IPlug
          ./download-iplug-sdks.sh

      - name: Get prebuilt audio libraries
        shell: bash
        working-directory: nam-vst3-source
        run: |
          cd iPlug2/Dependencies
          ./download-prebuilt-libs.sh

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build VST3
        shell: pwsh
        working-directory: nam-vst3-source
        run: |
          Set-Location NeuralAmpModeler/scripts
          .\makedist-win.bat full zip

      - name: Locate VST3 and install Web UI resources
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem nam-vst3-source -Recurse -Filter '*.vst3' -Directory |
            Where-Object { $_.FullName -notmatch '\\iPlug2\\' } |
            Where-Object { $_.FullName -notmatch '\\NeuralAmpModeler\.vst3$' } |
            Select-Object -First 1
          if (-not $vst3) { throw 'No SOLAR AMP VST3 bundle produced.' }
          New-Item -ItemType Directory -Force vst3-dist | Out-Null
          Copy-Item -Recurse $vst3.FullName 'vst3-dist\SOLAR AMP.vst3'
          $resources = 'vst3-dist\SOLAR AMP.vst3\Contents\Resources\web'
          New-Item -ItemType Directory -Force $resources | Out-Null
          Copy-Item 'nam-vst3-source\NeuralAmpModeler\Resources\web\*' $resources -Recurse -Force
          Write-Host "VST3: $($vst3.FullName)"
          Write-Host "Web UI: $resources"

      - name: Validate
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/Tracktion/pluginval/releases/download/latest_release/pluginval_Windows.zip' -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval -Force
          & '.\pluginval\pluginval.exe' --skip-gui-tests --validate-in-process --validate (Resolve-Path 'vst3-dist\SOLAR AMP.vst3')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify SOLAR AMP WebView bundle
        shell: pwsh
        run: |
          $bundle = Resolve-Path 'vst3-dist\SOLAR AMP.vst3'
          $dll = Get-ChildItem $bundle -Recurse -File -Filter 'SOLARAMP.vst3' | Select-Object -First 1
          if (-not $dll) { throw 'SOLARAMP.vst3 binary not found inside the bundle.' }
          if (-not (Test-Path (Join-Path $bundle 'Contents\Resources\web\index.html'))) { throw 'WebView index.html missing.' }
          if (-not (Test-Path (Join-Path $bundle 'Contents\Resources\web\solar-amp-web.js'))) { throw 'SOLAR AMP WebView JS missing.' }
          $old = Get-ChildItem $bundle -Recurse -File -Filter 'NeuralAmpModeler.vst3'
          if ($old) { throw 'Old NeuralAmpModeler.vst3 binary still exists in SOLAR AMP bundle.' }
          Write-Host 'SOLAR AMP WebView bundle identity/resources verified.'

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path 'vst3-dist\SOLAR AMP.vst3' -DestinationPath 'SOLAR-AMP-VST3-Windows-x64.zip' -Force

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SOLAR-AMP-VST3-Windows-x64
          path: SOLAR-AMP-VST3-Windows-x64.zip
