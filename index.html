<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>Solar Amp</title></head><body><main><header><div><small>SOLAR AMP</small><h1>NAM LOADER</h1></div><button id="install" hidden>INSTALL</button></header><section class="status"><div><span>ENGINE</span><b id="engine">WEB AUDIO</b></div><div><span>RATE</span><b id="rate">—</b></div><div><span>LATENCY</span><b id="latency">—</b></div></section><section class="tuner"><span>TUNER</span><strong id="note">—</strong><b id="hz">—</b><i id="cents">PLAY A NOTE</i></section><section class="meters"><label>INPUT <meter id="in" min="0" max="1" value="0"></meter></label><label>OUTPUT <meter id="out" min="0" max="1" value="0"></meter></label></section><button id="start" class="start">START AUDIO</button><section class="rig"><div class="card"><h2>AMP</h2><div class="knobs" id="amp"></div></div><div class="card"><h2>OD</h2><div class="knobs" id="od"></div></div><div class="card"><h2>EQ / CAB</h2><div class="knobs" id="eq"></div></div><div class="card"><h2>FX</h2><div class="knobs" id="fx"></div></div></section><section class="card model"><h2>NAM MODEL</h2><input id="nam" type="file" accept=".nam,.json"><p id="modelStatus">No model loaded</p></section><section class="card"><h2>TONE3000</h2><p>OAuth/online model integration is provided by the server app. This standalone PWA currently tests the local audio/model workflow.</p></section></main><script src="app.js"></script></body></html>
